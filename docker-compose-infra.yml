# MySQL + Redis + OpenObserve for local development, selected by APP_ENV (default
# `development`). Published host ports come from your shell, not the env file. See the Docker
# section of apps/server/README.md.

name: template-nest-next-infra

services:
  mysql:
    image: mysql:8.4
    container_name: template-nest-next-mysql-${APP_ENV:-development}
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    env_file:
      - apps/server/.env.${APP_ENV:-development}
    environment:
      MYSQL_HOST: ""
    volumes:
      - mysql-data:/var/lib/mysql
      - ./apps/server/prisma/scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h localhost -p"$$MYSQL_ROOT_PASSWORD"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: template-nest-next-redis-${APP_ENV:-development}
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    env_file:
      - apps/server/.env.${APP_ENV:-development}
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
               exec redis-server --requirepass "$$REDIS_PASSWORD";
             else
               exec redis-server;
             fi'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The "-debug" tag is used on purpose: the plain tag ships no shell and no curl/wget, so a
  # container-exec healthcheck against it is not possible (confirmed against the image).
  openobserve:
    image: openobserve/openobserve:v1.0.3-debug
    container_name: template-nest-next-openobserve-${APP_ENV:-development}
    restart: unless-stopped
    ports:
      - "${OPENOBSERVE_PORT:-5080}:5080"
    env_file:
      - apps/server/.env.${APP_ENV:-development}
    environment:
      ZO_DATA_DIR: /data
    volumes:
      - openobserve-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  mysql-data:
  redis-data:
  openobserve-data:
