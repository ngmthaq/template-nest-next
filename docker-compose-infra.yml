# MySQL + Redis for local development, selected by NODE_ENV (default `development`). Published
# host ports come from your shell, not the env file. See the Docker section of apps/server/README.md.

name: template-nest-next-infra

services:
  mysql:
    image: mysql:8.4
    container_name: template-nest-next-mysql-${NODE_ENV:-development}
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    env_file:
      - apps/server/.env.${NODE_ENV:-development}
    environment:
      MYSQL_HOST: ""
    volumes:
      - mysql-data:/var/lib/mysql
      - ./apps/server/prisma/scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h localhost -p"$$MYSQL_ROOT_PASSWORD"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: template-nest-next-redis-${NODE_ENV:-development}
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    env_file:
      - apps/server/.env.${NODE_ENV:-development}
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
               exec redis-server --requirepass "$$REDIS_PASSWORD";
             else
               exec redis-server;
             fi'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
  redis-data:
